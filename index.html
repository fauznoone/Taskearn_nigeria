<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskEarn Nigeria</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      text-align: center;
      margin: 0;
    }
    header {
      background: #087b42;
      color: white;
      padding: 25px 10px;
    }
    .box {
      background: white;
      margin: 25px auto;
      padding: 25px;
      max-width: 400px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #ccc;
    }
    button {
      background: #087b42;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 6px;
      font-size: 16px;
      margin: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>TaskEarn Nigeria</h1>
    <p>Complete tasks and earn rewards</p>
  </header>

  <div class="box">
    <h2>Welcome!</h2>
    <p>Create an account to get started.</p>
    <button onclick="alert('Account registration will be available when the secure account system is connected.')">Register</button>
    <button onclick="alert('Login will be available when the secure account system is connected.')">Login</button>
  </div>

  <div class="box">
    <h2>Available Tasks</h2>
    <p>Tasks and verified rewards will appear here.</p>
  </div>

  <div class="box">
    <h2>Withdrawals</h2>
    <p>Secure payment options will be added after payment integration.</p>
  </div>

  <footer>
    <p>© 2026 TaskEarn Nigeria</p>
  </footer>
</body>
</html>
